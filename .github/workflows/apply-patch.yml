name: Apply website patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PATCH_SHA256: "e9773f2a493029574994ef9202594e20f7fee83add089751150f60613fc6b082"
    steps:
      - uses: actions/checkout@v4

      - name: Download and apply patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download patch-1 --repo "$GITHUB_REPOSITORY" --pattern 'balloonslanee-patch.zip' --dir /tmp/dl
          echo "$PATCH_SHA256  /tmp/dl/balloonslanee-patch.zip" | sha256sum -c -
          mkdir -p /tmp/patch
          unzip -q /tmp/dl/balloonslanee-patch.zip -d /tmp/patch
          test -f /tmp/patch/index.html
          test -f /tmp/patch/.htaccess
          grep -q 'formsubmit.co/seooptimizeragency@gmail.com' /tmp/patch/index.html
          cp -r /tmp/patch/. ./
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Speed fixes and form email update"
          git push origin HEAD:main
