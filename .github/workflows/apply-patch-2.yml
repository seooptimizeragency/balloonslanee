name: Apply website patch 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-patch-2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download patch zip
        run: curl -fL -o patch2.zip https://github.com/seooptimizeragency/balloonslanee/releases/download/patch-2/balloonslanee-patch2.zip
      - name: Verify checksum
        run: echo "85fdc95b621c8c1ded52fb0c122101d33bfc2320c2df6fa5b507663f9e0637c9  patch2.zip" | sha256sum -c -
      - name: Unpack patch
        run: |
          mkdir patch
          unzip -q patch2.zip -d patch
          test -f patch/1st-birthday-party/index.html
          grep -q 'righteous/v18' patch/1st-birthday-party/index.html
          test -f patch/images/1st-birthday-party/gold-one-letter-balloon-garland-hero-mobile.avif
          echo "Patch files: $(find patch -type f | wc -l)"
      - name: Apply patch and commit
        run: |
          cp -r patch/. .
          rm -rf .github patch patch2.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mobile speed round 2: font preloads and lighter hero images"
          git push
