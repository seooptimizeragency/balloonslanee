name: Apply patch 5
on:
  push:
    paths:
      - '.github/workflows/apply-patch-5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify patch
        run: |
          curl -L -o /tmp/patch5.zip https://github.com/seooptimizeragency/balloonslanee/releases/download/patch-5/balloonslanee-patch5.zip
          echo "df7869f414d176eefe819fbb5ed12822082cd95fdf9e6199aca09a77188dc159  /tmp/patch5.zip" | sha256sum -c -
          mkdir -p /tmp/patch5
          unzip -q /tmp/patch5.zip -d /tmp/patch5
      - name: Apply patch
        run: |
          cp -a /tmp/patch5/. .
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Form in-page submit, messages and mandatory human check"
          git push
