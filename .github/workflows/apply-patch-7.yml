name: Apply patch 7
on:
  push:
    paths:
      - '.github/workflows/apply-patch-7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify patch
        run: |
          curl -L -o /tmp/patch7.zip https://github.com/seooptimizeragency/balloonslanee/releases/download/patch-7/balloonslanee-patch7.zip
          echo "51543e6085c577bc23e3aeb2f7ab5f08bf9aea2622323f219e9e3870533f6b54  /tmp/patch7.zip" | sha256sum -c -
          mkdir -p /tmp/patch7
          unzip -q /tmp/patch7.zip -d /tmp/patch7
      - name: Apply patch
        run: |
          cp -a /tmp/patch7/. .
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Form send fix: classic in-page submit detection"
          git push
